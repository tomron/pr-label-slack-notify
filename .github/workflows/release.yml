name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version matching package.json (for example 1.0.0)
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'const v=process.env.VERSION;if(!/^\d+\.\d+\.\d+$/.test(v)||v!==require("./package.json").version)process.exit(1)'
          test "$(git branch --show-current)" = main
          ! git rev-parse "v$VERSION" >/dev/null 2>&1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: git diff --exit-code -- dist
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git tag -f "v${VERSION%%.*}"
          git push origin "v$VERSION"
          git push origin "v${VERSION%%.*}" --force
          gh release create "v$VERSION" --verify-tag --generate-notes
